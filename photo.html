<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>请在浏览器中打开</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f5f6fa;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow-x: hidden;
        }

        /* ============ 微信内显示的遮罩层 ============ */
        .wechat-mask {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.82);
            z-index: 9999;
        }

        .wechat-mask.show {
            display: block;
        }

        /* 右上角箭头指引 */
        .arrow-hint {
            position: absolute;
            top: 10px;
            right: 18px;
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 28px solid #07c160;
            transform: rotate(-15deg);
            animation: bounce 1s ease-in-out infinite alternate;
        }

        @keyframes bounce {
            from { transform: rotate(-15deg) translateY(0); }
            to { transform: rotate(-15deg) translateY(8px); }
        }

        .arrow-text {
            position: absolute;
            top: 52px;
            right: 8px;
            color: #07c160;
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
        }

        /* 主体内容 */
        .mask-content {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 86%;
            max-width: 340px;
            text-align: center;
        }

        .mask-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            background: #07c160;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mask-icon svg {
            width: 40px;
            height: 40px;
        }

        .mask-title {
            color: #ffffff;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .mask-desc {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 28px;
        }

        .mask-steps {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px 16px;
            text-align: left;
        }

        .mask-step {
            display: flex;
            align-items: flex-start;
            margin-bottom: 14px;
        }

        .mask-step:last-child {
            margin-bottom: 0;
        }

        .step-num {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            background: #07c160;
            border-radius: 50%;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            margin-top: 1px;
        }

        .step-text {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            line-height: 1.6;
        }

        .step-text b {
            color: #ffffff;
            font-weight: 600;
        }

        /* ============ 非微信浏览器显示的页面 ============ */
        .normal-page {
            display: none;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }

        .normal-card {
            max-width: 400px;
            width: 100%;
            background: #fff;
            border-radius: 16px;
            padding: 44px 28px 36px;
            text-align: center;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
        }

        .normal-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            background: #f0f5ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #e0e0e0;
            border-top-color: #4a7dff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .normal-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .normal-desc {
            font-size: 14px;
            color: #999;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn-go {
            display: block;
            width: 100%;
            height: 48px;
            line-height: 48px;
            background: #4a7dff;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            border: none;
            border-radius: 12px;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-go:active {
            background: #3a6ae8;
        }

        .normal-footer {
            margin-top: 24px;
            font-size: 12px;
            color: #bbb;
        }
    </style>
</head>
<body>

    <!-- ====== 微信遮罩层 ====== -->
    <div class="wechat-mask" id="wechatMask">
        <div class="arrow-hint"></div>
        <div class="arrow-text">点击右上角</div>

        <div class="mask-content">
            <div class="mask-icon">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M3 3h18v2H3V3zm0 16h18v2H3v-2zm0-8l4 4-4 4v-8z" fill="#fff"/>
                    <path d="M9 12h10v2H9v-2z" fill="#fff"/>
                </svg>
            </div>
            <div class="mask-title">请在浏览器中打开</div>
            <div class="mask-desc">当前页面需要在浏览器中打开才能正常访问</div>

            <div class="mask-steps">
                <div class="mask-step">
                    <div class="step-num">1</div>
                    <div class="step-text">点击右上角 <b>三个点</b> 图标</div>
                </div>
                <div class="mask-step">
                    <div class="step-num">2</div>
                    <div class="step-text">在弹出菜单中选择 <b>"在浏览器中打开"</b></div>
                </div>
                <div class="mask-step">
                    <div class="step-num">3</div>
                    <div class="step-text">页面将在浏览器中自动打开表单</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ====== 非微信浏览器显示的页面（自动跳转） ====== -->
    <div class="normal-page" id="normalPage">
        <div class="normal-card">
            <div class="normal-icon">
                <div class="spinner"></div>
            </div>
            <div class="normal-title">正在为您打开照片查询</div>
            <div class="normal-desc">请稍候，正在跳转中...</div>
            <a href="https://my.feishu.cn/share/base/query/shrcnnLfiQWn9xEXDCWSVSGPKAT" class="btn-go">点击进入表单</a>
            <div class="normal-footer">若未自动跳转，请点击上方按钮</div>
        </div>
    </div>

    <script>
        (function() {
            var targetUrl = 'https://my.feishu.cn/share/base/query/shrcnnLfiQWn9xEXDCWSVSGPKAT';
            var isWeChat = /MicroMessenger/i.test(navigator.userAgent);
            var mask = document.getElementById('wechatMask');
            var normalPage = document.getElementById('normalPage');

            if (isWeChat) {
                // 微信环境：显示遮罩引导页，不跳转
                mask.classList.add('show');
            } else {
                // 非微信环境：显示正常页面，1.5秒后自动跳转
                normalPage.style.display = 'flex';
                setTimeout(function() {
                    window.location.href = targetUrl;
                }, 1500);
            }
        })();
    </script>
</body>
</html>
